<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Processor Test App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Data Input Test</h1>
    <h2>CSV File</h2>
    <input type="file" id="csvFile" accept=".csv">
    <button id="csvScatterButton">Render CSV Scatter Plot</button>
    <button id="csvLineButton">Render CSV Line Plot</button>
    <p id="csvMessage"></p>
    <hr>
    <h2>Text Input</h2>
    <textarea
        id="textInput"
        rows="10"
        cols="40"
        placeholder="Enter data here, for example:
x,y
3,7
9,1
5,12"></textarea>
    <br>
    <button id="textScatterButton">Render Text Scatter Plot</button>
    <button id="textLineButton">Render Text Line Plot</button>
    <p id="textMessage"></p>
    <hr>
    <div id="chart" class="chart"></div>
    <script src="data_processer.js"></script>
    <script src="graph.js"></script>

    <script>
        let csvData = null;
        const fileInput = document.getElementById("csvFile");
        const csvMessage = document.getElementById("csvMessage");
        const textMessage = document.getElementById("textMessage");
        const chart = document.getElementById("chart");

        fileInput.addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                const csvText = event.target.result;
                const result = parseCSV(csvText);
                console.log("CSV parser result:", result);
                if (!result.success) {
                    csvMessage.textContent = result.error;
                    csvData = null;
                    return;
                }
                csvData = result.data;
                csvMessage.textContent =
                    `Loaded ${csvData.length} points. ` +
                    `X: ${result.headers.x}, Y: ${result.headers.y}`;
            };
            reader.readAsText(file);
        });
        // when button is clicked, render the scatter plot using CSV data (this is not the text box button)
        document.getElementById("csvScatterButton")
            .addEventListener("click", function() {

                if (!csvData) {
                    csvMessage.textContent =
                        "Please load a valid CSV first.";
                    return;
                }

                renderScatterPlot(csvData, chart);
            });
        // when button is clicked, render the line plot using CSV data (this is not the text box button)
        document.getElementById("csvLineButton")
            .addEventListener("click", function() {

                if (!csvData) {
                    csvMessage.textContent =
                        "Please load a valid CSV first.";
                    return;
                }
                renderLineChart(csvData, chart);
            });
        // when button is clicked, render the scatter plot using text box data
        document.getElementById("textScatterButton")
            .addEventListener("click", function() {
                const text =
                    document.getElementById("textInput").value;
                const result = parseTextInput(text);
                console.log("Text parser result:", result);
                if (!result.success) {
                    textMessage.textContent = result.error;
                    return;
                }
                textMessage.textContent =
                    `Loaded ${result.data.length} points. ` +
                    `X: ${result.headers.x}, Y: ${result.headers.y}`;
                renderScatterPlot(result.data, chart);
            });
        // when button is clicked, render the line plot using text box data
        document.getElementById("textLineButton")
            .addEventListener("click", function() {
                const text =
                    document.getElementById("textInput").value;

                const result = parseTextInput(text);
                console.log("Text parser result:", result);
                if (!result.success) {
                    textMessage.textContent = result.error;
                    return;
                }
                textMessage.textContent =
                    `Loaded ${result.data.length} points. ` +
                    `X: ${result.headers.x}, Y: ${result.headers.y}`;
                renderLineChart(result.data, chart);
            });
    </script>
</body>
</html>
