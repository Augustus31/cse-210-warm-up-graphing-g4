<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph Designer</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #222; }
    header { padding: 16px 24px; background: #f2f2f2; }
    nav { display: flex; justify-content: space-between; max-width: 900px; margin: auto; }
    nav a { margin-left: 16px; color: inherit; text-decoration: none; }
    main { max-width: 900px; margin: 48px auto; padding: 0 24px; }
  </style>
</head>
<body>
  <script type="module">
    import { renderGraph } from './graph.js';  // use your file's actual name/path

    renderGraph({
      points: [{ x: 1, y: 10 }, { x: 4, y: 30 }, { x: 9, y: 25 }],
      type: 'line',
      title: 'Test graph',
      pointColor: '#2563eb',
      lineColor: '#2563eb',
      axesColor: '#333333',
      pointStyle: 'circle',
      xAxisName: 'Time',
      yAxisName: 'Value',
      range: { xMin: 0, xMax: 10, yMin: 0, yMax: 40 },
    }, document.querySelector('#graph1'));
  </script>
  <header>
    <nav>
      <strong>My Website</strong>
      <div>
        <a href="#link1">Home</a>
        <a href="#link2">About</a>
        <a href="#link3">Contact</a>
      </div>
    </nav>
  </header>

  <main id="home">
    <h1>Welcome</h1>
    <p>Sample template: fill in content here</p>
    <div id="graph1" class="chart"></div>
  </main>
</body>
</html>
