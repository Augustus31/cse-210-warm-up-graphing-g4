<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpligraph</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; font-family: 'IM Fell DW Pica', serif; color: #222; }
    header { padding: 36px 24px; background: #e0e0e0;  font-size: 64px; display: flex; align-items: center; justify-content: space-around;}
    main {
      max-width: 100%;
      width: 100%;

      flex: 1;
      min-height: 0;

      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
      grid-template-rows: auto minmax(0, 1fr);

      gap: 2px;
      border: 3px solid black;
      background: black;

      align-self: center;
    }
    .panel { box-sizing: border-box; padding: 1%; background: white; }
    .square-area { width: 100%; aspect-ratio: 2; }
    .bottom-area { grid-column: 1 / -1; }
    
    .sidebar { min-width: 0; }
    .table-scroll { max-height: 40vh; overflow-y: auto; }
    .coordinate-table { width: 100%; table-layout: fixed; border-spacing: 4px; }
    .coordinate-table th { text-align: left; }
    .coordinate-table input,
    #add-row {
      box-sizing: border-box;
      width: 100%;
      padding: 6px;
      border: 2px solid #030303;
      background: #bbbbbb;
      color: inherit;
      font: inherit;
    }
    #add-row { display: block; width: 50%; margin: 4px auto 0; cursor: pointer; }
  </style>
</head>


<body>
  <header>
    <strong>Simpligraph</strong>
    <img id="calculator-icon" src="Resources/Images/calculator-icon.png">
  </header>

  <main id="home">
    <aside class="panel sidebar" aria-label="Left sidebar">
      <div class="table-scroll">
        <table class="coordinate-table">
          <thead>
            <tr><th scope="col">X axis</th><th scope="col">Y axis</th></tr>
          </thead>
          <tbody id="coordinate-rows">
            <tr>
              <td><input type="number" step="any" aria-label="X 1"></td>
              <td><input type="number" step="any" aria-label="Y 1"></td>
            </tr>
            <tr>
              <td><input type="number" step="any" aria-label="X 2"></td>
              <td><input type="number" step="any" aria-label="Y 2"></td>
            </tr>
            <tr>
              <td><input type="number" step="any" aria-label="X 3"></td>
              <td><input type="number" step="any" aria-label="Y 3"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <button id="add-row" type="button">Add row</button>
    </aside>
    <section class="panel square-area" aria-label="Square area"></section>
    <section class="panel bottom-area" aria-label="Bottom area"></section>
  </main>
  <script>
    const coordinateRows = document.getElementById('coordinate-rows');
    document.getElementById('add-row').addEventListener('click', () => {
      const rowNumber = coordinateRows.rows.length + 1;
      const row = coordinateRows.insertRow();

      for (const axis of ['X', 'Y']) {
        const cell = row.insertCell();
        const input = document.createElement('input');
        input.type = 'number';
        input.step = 'any';
        input.setAttribute('aria-label', `${axis} ${rowNumber}`);
        cell.append(input);
      }
    });
  </script>
</body>
</html>
