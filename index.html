<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpligraph</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>


<body>
  <header>
    <strong>Simpligraph</strong>
    <img src="Resources/Images/calculator-icon.png">
  </header>

  <main>
    <aside class="panel" id="data-table"></aside>
    <section class="panel" id="chart"></section>
    <section class="panel bottom-area" id="graph-settings"></section>
  </main>
  <script src="data_processer.js"></script>
  <script src="csv_loader.js"></script>
  <script type="module">
    import { GraphSettings } from './components/GraphSettings.js';
    import { DataTable } from './components/DataTable.js';
    import { setGraphValue, updateGraph } from './graphState.js';

    const csvStatus = document.createElement('p');
    csvStatus.id = 'csv-status';
    csvStatus.setAttribute('role', 'status');
    csvStatus.setAttribute('aria-live', 'polite');
    const csvLoader = createCsvLoader({
      parse: parseCSV,
      onStatus: message => { csvStatus.textContent = message; },
    });

    function saveToGraph(key) {
      return function (value) {
        setGraphValue(key, value);
      };
    }

    document.getElementById('graph-settings').append(GraphSettings({
      onPlotTypeChange: saveToGraph('type'),
      onTitleChange: saveToGraph('title'),
      onPointColorChange: saveToGraph('pointColor'),
      onLineColorChange: saveToGraph('lineColor'),
      onAxesColorChange: saveToGraph('axesColor'),
      onPointStyleChange: saveToGraph('pointStyle'),
      onXAxisNameChange: saveToGraph('xAxisName'),
      onYAxisNameChange: saveToGraph('yAxisName'),
      onAxisRangeChange: saveToGraph('range'),
      onCsvLoad(file) {
        return csvLoader.load(file);
      },
      onSave() {
        //export the graph (if we have time for this, if not imma just delete the button)
      },
    }));

    document.getElementById('data-table').append(DataTable({
      onPointsChange(points) {
        csvLoader.cancel();
        setGraphValue('points', points);
      },
    }));

    document.querySelector('[name="csv"]').closest('.settings-column').append(csvStatus);
    updateGraph();
  </script>
</body>
</html>
